services:
  scheduler:
    build: .
    container_name: job-data-pipeline
    env_file: .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
